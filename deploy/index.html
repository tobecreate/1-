// 自我对弈状态：AI 自动执红黑双方连续走子（完整控制：开始/暂停、单步、快中慢三档速度）
let selfPlayMode=false,selfPlayPaused=false,selfPlaySpeed=1000,selfPlayTimer=null,selfStepOnce=false;
// 标记"上一局为自我对弈"（供结算界面显示中性文案，而非"你赢了"）
let selfPlayFinished=false;
// 记谱模式：玩家手动录入外来棋谱（双方均由玩家点击走子，AI 不参与、不做引擎分析）
let recordMode=false;
// 玩家执子颜色（支持先后手切换）：red=执红先行，black=执黑后行
let playerColor='red';
function getAiColor(){return playerColor==='red'?'black':'red';}
// 将死胜者判定：被将死方是 checkColor，胜者为另一色
function winnerWhenCheckmated(checkColor){
  return checkColor==='red'?'black_won':'red_won';
}
// 主线程杀棋分常量（与Worker一致，用于胜率映射）
const MATE_SCORE=90000;
const MATE_THRESHOLD=85000;
let redTime=600,blackTime=600,moveTime=0;
let timerInterval=null,moveTimerInterval=null;
let startTime=0;

// ===== 初始化棋盘 =====
function createInitialBoard(){
  const b=Array(ROWS).fill(null).map(()=>Array(COLS).fill(null));
  const setup=(r,c,type,color)=>{b[r][c]={type,color,row:r,col:c};};
  // 黑方
  setup(0,0,'chariot','black');setup(0,1,'horse','black');setup(0,2,'elephant','black');
  setup(0,3,'advisor','black');setup(0,4,'king','black');setup(0,5,'advisor','black');
  setup(0,6,'elephant','black');setup(0,7,'horse','black');setup(0,8,'chariot','black');
  setup(2,1,'cannon','black');setup(2,7,'cannon','black');
  for(let c=0;c<COLS;c+=2)setup(3,c,'soldier','black');
  // 红方
  setup(9,0,'chariot','red');setup(9,1,'horse','red');setup(9,2,'elephant','red');
  setup(9,3,'advisor','red');setup(9,4,'king','red');setup(9,5,'advisor','red');
  setup(9,6,'elephant','red');setup(9,7,'horse','red');setup(9,8,'chariot','red');
  setup(7,1,'cannon','red');setup(7,7,'cannon','red');
  for(let c=0;c<COLS;c+=2)setup(6,c,'soldier','red');
  return b;
}

function cloneBoard(b){return b.map(row=>row.map(p=>p?{...p}:null));}

// ===== 规则引擎 =====
function isInBoard(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS;}
function isInPalace(r,c,color){
  if(c<3||c>5)return false;
  return color==='red'?r>=7&&r<=9:r>=0&&r<=2;
}
function hasCrossedRiver(r,color){return color==='red'?r<=4:r>=5;}
function isOwnSide(r,color){return color==='red'?r>=5:r<=4;}

function getValidMoves(b,piece,captureCheck){
  captureCheck=captureCheck!==false;
  const moves=[];
  const{row,col,type,color}=piece;
  switch(type){
    case'king':getKingMoves(b,piece,moves);break;
    case'advisor':getAdvisorMoves(b,piece,moves);break;
    case'elephant':getElephantMoves(b,piece,moves);break;
    case'horse':getHorseMoves(b,piece,moves);break;
    case'chariot':getChariotMoves(b,piece,moves);break;
    case'cannon':getCannonMoves(b,piece,moves);break;
    case'soldier':getSoldierMoves(b,piece,moves);break;
  }
  if(captureCheck){
    return moves.filter(target=>{
      const tb=cloneBoard(b);
      tb[target.row][target.col]={...tb[row][col],row:target.row,col:target.col};
      tb[row][col]=null;
      return!isKingInCheck(tb,color);
    });
  }
  return moves;
}

function canMoveTo(b,from,tr,tc){
  if(!isInBoard(tr,tc))return false;
  const t=b[tr][tc];
  if(t&&t.color===from.color)return false;
  return true;
}

function getKingMoves(b,p,moves){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of dirs){
    const nr=p.row+dr,nc=p.col+dc;
    if(isInPalace(nr,nc,p.color)&&canMoveTo(b,p,nr,nc))moves.push({row:nr,col:nc});
  }
  // 飞将
  const oc=p.color==='red'?'black':'red';
  const ok=findKing(b,oc);
  if(ok&&ok.col===p.col){
    let blocked=false;
    for(let r=Math.min(p.row,ok.row)+1;r<Math.max(p.row,ok.row);r++){
      if(b[r][p.col]){blocked=true;break;}
    }
    if(!blocked)moves.push({row:ok.row,col:ok.col});
  }
}

function getAdvisorMoves(b,p,moves){
  const dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
  for(const[dr,dc]of dirs){
    const nr=p.row+dr,nc=p.col+dc;
    if(isInPalace(nr,nc,p.color)&&canMoveTo(b,p,nr,nc))moves.push({row:nr,col:nc});
  }
}

function getElephantMoves(b,p,moves){
  const dirs=[[-2,-2],[-2,2],[2,-2],[2,2]];
  for(const[dr,dc]of dirs){
    const nr=p.row+dr,nc=p.col+dc;
    if(!isInBoard(nr,nc)||!isOwnSide(nr,p.color))continue;
    if(b[p.row+dr/2][p.col+dc/2])continue;
    if(canMoveTo(b,p,nr,nc))moves.push({row:nr,col:nc});
  }
}

function getHorseMoves(b,p,moves){
  const patterns=[
    [-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],
    [-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]
  ];
  for(const[dr,dc,br,bc]of patterns){
    const nr=p.row+dr,nc=p.col+dc;
    if(!isInBoard(nr,nc))continue;
    if(b[p.row+br]?.[p.col+bc])continue;
    if(canMoveTo(b,p,nr,nc))moves.push({row:nr,col:nc});
  }
}

function getChariotMoves(b,p,moves){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of dirs){
    let nr=p.row+dr,nc=p.col+dc;
    while(isInBoard(nr,nc)){
      if(!b[nr][nc]){moves.push({row:nr,col:nc});}
      else{if(b[nr][nc].color!==p.color)moves.push({row:nr,col:nc});break;}
      nr+=dr;nc+=dc;
    }
  }
}

function getCannonMoves(b,p,moves){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc]of dirs){
    let nr=p.row+dr,nc=p.col+dc;
    while(isInBoard(nr,nc)&&!b[nr][nc]){moves.push({row:nr,col:nc});nr+=dr;nc+=dc;}
    if(isInBoard(nr,nc)){
      nr+=dr;nc+=dc;
      while(isInBoard(nr,nc)){
        if(b[nr][nc]){if(b[nr][nc].color!==p.color)moves.push({row:nr,col:nc});break;}
        nr+=dr;nc+=dc;
      }
    }
  }
}

function getSoldierMoves(b,p,moves){
  const fwd=p.color==='red'?-1:1;
  const nr=p.row+fwd;
  if(isInBoard(nr,p.col)&&canMoveTo(b,p,nr,p.col))moves.push({row:nr,col:p.col});
  if(hasCrossedRiver(p.row,p.color)){
    for(const dc of[-1,1]){
      if(isInBoard(p.row,p.col+dc)&&canMoveTo(b,p,p.row,p.col+dc))moves.push({row:p.row,col:p.col+dc});
    }
  }
}

function findKing(b,color){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=b[r][c];
    if(p&&p.type==='king'&&p.color===color)return p;
  }
  return null;
}

function isKingInCheck(b,color){
  const king=findKing(b,color);
  if(!king)return true;
  const oc=color==='red'?'black':'red';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=b[r][c];
    if(p&&p.color===oc){
      const moves=getValidMoves(b,p,false);
      if(moves.some(m=>m.row===king.row&&m.col===king.col))return true;
    }
  }
  return false;
}

function isCheckmate(b,color){
  if(!isKingInCheck(b,color))return false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=b[r][c];
    if(p&&p.color===color){
      if(getValidMoves(b,p,true).length>0)return false;
    }
  }
  return true;
}

function hasAnyLegalMove(b,color){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=b[r][c];
    if(p&&p.color===color){
      if(getValidMoves(b,p,true).length>0)return true;
    }
  }
  return false;
}

function doMove(b,from,to){
  const nb=cloneBoard(b);
  const piece=nb[from.row][from.col];
  const captured=nb[to.row][to.col];
  if(piece){
    nb[to.row][to.col]={...piece,row:to.row,col:to.col,hasMoved:true};
    nb[from.row][from.col]=null;
  }
  return{board:nb,captured};
}

// ===== 统一引擎接口（抽象层，隔离UI/复盘/棋谱与博弈引擎实现） =====
// 【契约】上层界面只允许调用以下标准方法，禁止直接调用引擎内部搜索/评估函数：
//   生命周期：init / isReady / quit
//   局面与搜索：setPosition / startAnalysis / stopAnalysis / getScore / getBestMove
// 【后端】仅 Pikafish（UCI WASM 引擎，通过 engineAdapter.js 路由）。
//   内置 JS 引擎已彻底禁用：内嵌 Worker 永不创建、永不调用，任何非 pikafish 路径不可达。
//   其余 UI 代码零改动。
const Engine={
  // === 引擎元信息（供上层识别/调试） ===
  name:'xiangqi-pikafish-only',
  protocol:'pikafish', // 唯一后端（内置JS引擎已禁用）

  // === 后端路由：仅 pikafish（UCI WASM引擎） ===
  _backend:'pikafish',
  _pf:null,

  _worker:null,
  _bestMoveCb:null,
  _analysisCb:null,
  _token:0,
  _lastAnalysis:null,
  _board:null,

  /**
   * 切换引擎后端（上层接口不变）
   * @param name 仅 'pikafish'；内置JS引擎已禁用，其他值一律忽略
   * @returns 实际生效的后端名（恒为 'pikafish'）
   */
  setBackend(name){
    if(window.EngineAdapter){
      this._backend=EngineAdapter.setBackend('pikafish');
    }else{
      this._backend='pikafish';
    }
    return this._backend;
  },

  /** Pikafish 后端是否就绪可用 */
  _pfReady(){
    return !!(window.EngineAdapter&&EngineAdapter.isPikafishReady());
  },

  /**
   * 初始化引擎。
   * 【已禁用】内置 JS 引擎（内嵌 ai-worker 最小搜索引擎）不再创建——代码保留，
   * 但本方法直接 return，确保 Worker 永不创建、内部引擎路径全部不可达。
   */
  init(){
    return; // 内置JS引擎已彻底禁用：不创建任何 Worker，系统只使用 Pikafish
    if(this._worker)return;
    const workerCode=document.getElementById('ai-worker').textContent;
    const blob=new Blob([workerCode],{type:'application/javascript'});
    this._worker=new Worker(URL.createObjectURL(blob));
    this._worker.onmessage=(e)=>{
      const{type}=e.data;
      // 分析结果（胜率面板）
      if(type==='analysis'){
        const{analysis,token}=e.data;
        if(token===this._token&&this._analysisCb){
          if(analysis)this._lastAnalysis=analysis;
          const cb=this._analysisCb;
          this._analysisCb=null;
          cb(analysis);
        }
        return;
      }
      // 最佳走法结果（AI走子/提示）
      const{result,hint}=e.data;
      if(this._bestMoveCb){
        const cb=this._bestMoveCb;
        this._bestMoveCb=null;
        cb(result,hint);
      }
      isAiThinking=false;
      const t=document.getElementById('aiThinking');
      if(t)t.style.display='none';
    };
    this._worker.onerror=(err)=>{
      console.error('AI Worker错误:',err.message);
      isAiThinking=false;
      const t=document.getElementById('aiThinking');
      if(t)t.style.display='none';
      if(this._bestMoveCb){const cb=this._bestMoveCb;this._bestMoveCb=null;cb(null);}
      if(this._analysisCb){const cb=this._analysisCb;this._analysisCb=null;cb(null);}
    };
  },

  /** 引擎是否就绪（仅看 Pikafish；内置JS引擎已禁用） */
  isReady(){
    return this._pfReady();
  },

  /** 释放引擎资源（UCI quit 语义；重建对局时调用以彻底重置） */
  quit(){
    this._token++;
    this._bestMoveCb=null;
    this._analysisCb=null;
    if(window.EngineAdapter){try{EngineAdapter.quit();}catch(e){}}
    if(this._worker){
      try{this._worker.terminate();}catch(e){}
      this._worker=null;
    }
  },

  /** 走法→UCI格式（如 b1→"b9c9"？示例：行0-9/列0-8 → 文件a-i + 排名0-9）。替换UCI引擎时用此转换 */
  moveToUCI(move){
    const f={0:'a',1:'b',2:'c',3:'d',4:'e',5:'f',6:'g',7:'h',8:'i'};
    return f[move.from.col]+move.from.row+f[move.to.col]+move.to.row;
  },

  /** UCI格式→走法（解析外部引擎 bestmove 输出；rank0在红方底线，行=9-rank） */
  moveFromUCI(uci){
    if(!uci||uci.length<4)return null;
    const f={'a':0,'b':1,'c':2,'d':3,'e':4,'f':5,'g':6,'h':7,'i':8};
    const c0=f[uci[0]],r0=9-parseInt(uci[1]);
    const c1=f[uci[2]],r1=9-parseInt(uci[3]);
    if(c0===undefined||c1===undefined||isNaN(r0)||isNaN(r1))return null;
    return{from:{row:r0,col:c0},to:{row:r1,col:c1}};
  },

  /** 设置当前局面（供后续分析/走子使用） */
  setPosition(board){
    this._board=board;
    if(this._pfReady()&&window.boardToFen){
      try{EngineAdapter.setPosition(window.boardToFen(board,currentTurn));}catch(e){}
    }
  },

  /** 启动一次局面分析（搜索评估），结果通过回调返回 */
  startAnalysis(onDone){
    // Pikafish 后端：异步搜索对应难度深度后回调（限时800ms，避免阻塞AI走子）
    if(this._pfReady()){
      // 玩家落子后行棋方为AI，Pikafish score 为行棋方视角，需传入用于换算红方视角
      EngineAdapter.startAnalysis(getPikafishDepth(),1,800,getAiColor()).then(()=>{
        const s=EngineAdapter.getScore();
        onDone(s?{score:s.score,depth:s.depth,mate:s.mate||0}:null);
      }).catch(()=>onDone(null));
      return;
    }
    // 内置JS引擎已禁用：Pikafish 不可用时直接回调 null，绝不走内部 Worker 路径
    onDone(null);
    return;
    this.init();
    if(!this._board)return;
    // 防并发：递增token，使上一轮未完成分析的过期结果被丢弃
    this._token++;
    const token=this._token;
    this._analysisCb=onDone;
    this._worker.postMessage({
      type:'analysis',
      board:this._board,
      // 给足时间让搜索达到难度对应深度（≤800ms，控制CPU占用）
      timeLimit:Math.min(getTimeLimit(),800),
      maxDepth:getDepthLimit(),
      token
    });
  },

  /** 取消当前分析（递增token使旧结果失效） */
  stopAnalysis(){
    if(this._pfReady()){try{EngineAdapter.stopAnalysis();}catch(e){}}
    this._token++;
    this._analysisCb=null;
  },

  /** 获取最近一次分析结果 {score,staticScore,depth,mate}，无结果返回null */
  getScore(){
    // 内置JS引擎已禁用：无 Pikafish 评估时返回 null（不再读取 _lastAnalysis）
    if(this._pfReady()){
      const s=EngineAdapter.getScore();
      if(s)return{score:s.score,depth:s.depth,mate:s.mate||0};
    }
    return null;
  },

  /** 请求引擎计算最佳走法 */
  getBestMove(cb,color,timeLimit,maxDepth){
    // Pikafish 后端：UCI go depth 搜索，解析 bestmove（时间预算按难度）
    if(this._pfReady()){
      const depth=maxDepth||getPikafishDepth();
      EngineAdapter.getBestMove(color||'black',depth,timeLimit||getTimeLimit()).then(result=>{
        isAiThinking=false;
        const t=document.getElementById('aiThinking');
        if(t)t.style.display='none';
        cb(result);
      });
      return;
    }
    // 内置JS引擎已禁用：Pikafish 不可用时直接回调 null，绝不走内部 Worker 路径
    cb(null);
    return;
    this.init();
    this._bestMoveCb=cb;
    this._worker.postMessage({
      type:'bestmove',
      board:this._board,
      color:color||'black',
      timeLimit:timeLimit||getTimeLimit(),
      maxDepth:maxDepth||getDepthLimit(),
      moveCount:moveHistory.length,
      // 简单难度走法随机化，与中/高难度形成明显棋力差距
      randLevel:difficulty===1?1:0
    });
  }
};

// ===== 棋盘尺寸自适应（视口resize后重新计算，保证棋盘完整可见） =====
let CELL_SIZE=58,BOARD_PADDING=28,PIECE_SIZE=48;
// 显示行映射：后手（执黑）时棋盘上下翻转，黑方在自己脚下（交互仍用逻辑坐标）
function dispRow(r){return playerColor==='black'?(ROWS-1)-r:r;}
let _toolsH=180; // 棋盘下方工具条预留高度（动态校准）
function calcLayoutSizes(){
  const vw=window.innerWidth||document.documentElement.clientWidth;
  const vh=window.innerHeight||document.documentElement.clientHeight;
  // 堆叠模式：棋盘置顶占满整行，右侧面板堆叠在下方（移动端竖屏）
  const stacked=window.matchMedia('(max-width:700px)').matches;
  let cell;
  if(stacked){
    // 宽度：左右各留 12px 边距；棋盘优先占满可用宽度，垂直方向溢出由页面滚动承接
    const availW=vw-24;
    cell=Math.min(Math.floor(availW/8),58);
  }else{
    // 左右分栏：右侧面板区占用宽度（窄视口下CSS已将其收窄）
    const rightArea=document.querySelector('.right-area');
    const rightW=rightArea?rightArea.offsetWidth:252;
    const availW=vw-rightW-22-20;
    // 垂直方向：顶部预留约10px + 工具条实际高度 + 底部间距（顶部标题已移除）
    const availH=vh-10-_toolsH-12;
    cell=Math.min(Math.floor(availW/8),Math.floor(availH/9),58);
  }
  cell=Math.max(cell,26); // 最小缩放，避免过小
  CELL_SIZE=cell;
  BOARD_PADDING=Math.max(12,Math.round(cell*0.48));
  PIECE_SIZE=Math.max(22,Math.round(cell*0.83));
}
function resizeBoard(){
  calcLayoutSizes();
  renderBoard();
  updateUI();
  // 二次校准：工具条实际高度与预留不符且棋盘超出视口时重算，避免棋盘顶部被裁切
  const tools=document.querySelector('.board-tools');
  const area=document.querySelector('.board-area');
  const availVh=(window.innerHeight||document.documentElement.clientHeight)-10-12;
  if(tools&&area&&tools.offsetHeight>0){
    const realH=tools.offsetHeight+12;
    if(area.offsetHeight>availVh&&realH!==_toolsH){
      _toolsH=Math.max(realH,120);
      calcLayoutSizes();
      renderBoard();
      updateUI();
    }
  }
}
window.addEventListener('resize',()=>{
  clearTimeout(resizeBoard._t);
  resizeBoard._t=setTimeout(resizeBoard,120);
});

function getTimeLimit(){
  // 三档难度：单步思考均控制在2秒以内，避免浏览器卡顿假死
  const t={1:500,2:1000,3:1800};
  return t[difficulty]||1000;
}
function getDepthLimit(){
  // 三档难度对应不同搜索深度
  const d={1:2,2:3,3:4};
  return d[difficulty]||3;
}
function getPikafishDepth(){
  // Pikafish WASM 引擎三档搜索深度（NNUE评估强，深度可比内部引擎更深；≤12层防卡顿）
  const d={1:4,2:8,3:12};
  return d[difficulty]||8;
}
function getDiffName(){
  return {1:'简单',2:'中等',3:'困难'}[difficulty]||'中等';
}
function updateDiffInfo(){
  const info=document.getElementById('aiDiffInfo');
  if(info){
    const time=(getTimeLimit()/1000).toFixed(1);
    // 仅 Pikafish 后端（内置JS引擎已禁用），深度按 Pikafish 档位显示
    const depth=getPikafishDepth();
    info.textContent=`${getDiffName()} · 搜索深度${depth}层 · ≤${time}秒`;
  }
}

// ===== 音效（Web Audio API 本地软萌合成，无任何网络外链）=====
let audioCtx=null;
let soundEnabled=true;
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
}
// 软萌单音合成（清脆短促，无刺耳泛音）
function tone(freq,dur,vol,wave,opt){
  if(!audioCtx)return;
  opt=opt||{};
  const t=audioCtx.currentTime+(opt.delay||0);
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=wave||'sine';
  osc.frequency.setValueAtTime(freq,t);
  if(opt.to)osc.frequency.exponentialRampToValueAtTime(opt.to,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);osc.stop(t+dur+0.02);
}
function playSound(type){
  if(!soundEnabled)return;
  ensureAudio();if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(type==='move'){
    // 落子：柔和"噗叽"（低频下坠+轻弹）
    tone(320,0.13,0.5,'sine',{to:150});
  }else if(type==='capture'){
    // 吃子：轻快闪亮（两个短高音）
    tone(720,0.1,0.5,'triangle');
    tone(980,0.12,0.45,'triangle',{delay:0.06});
  }else if(type==='check'){
    // 将军：短促可爱警示（升调双音）
    tone(660,0.09,0.4,'square');
    tone(880,0.12,0.4,'square',{delay:0.09});
  }else if(type==='win'){
    // 胜利：欢快琶音
    [523,659,784,1047].forEach((f,i)=>tone(f,0.16,0.4,'triangle',{delay:i*0.09}));
  }else if(type==='select'){
    // 选中：清脆软萌叮咚
    tone(880,0.08,0.35,'sine');
    tone(1175,0.1,0.25,'sine',{delay:0.05});
  }
}

// ===== UI 渲染 =====
// CELL_SIZE / BOARD_PADDING / PIECE_SIZE 由 calcLayoutSizes() 按视口动态计算

function renderBoard(){
  const boardEl=document.getElementById('board');
  // 后手（执黑）时棋盘上下翻转，黑方在自己脚下：显示行=9-逻辑行（交互仍走逻辑坐标）
  const mr=dispRow;
  const bw=(COLS-1)*CELL_SIZE+BOARD_PADDING*2;
  const bh=(ROWS-1)*CELL_SIZE+BOARD_PADDING*2;
  // 特效判定：仅走子（moveHistory 增长）时触发，悔棋/重开不触发
  const prev=renderBoard._prev||null;
  const mvLen=moveHistory.length;
  const prevLen=renderBoard._mvLen||0;
  const isNewMove=mvLen>prevLen;
  boardEl.style.width=bw+'px';
  boardEl.style.height=bh+'px';
  boardEl.innerHTML='';

  // SVG 网格
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.cssText=`position:absolute;left:${BOARD_PADDING}px;top:${BOARD_PADDING}px;width:${(COLS-1)*CELL_SIZE}px;height:${(ROWS-1)*CELL_SIZE}px;pointer-events:none;`;
  svg.setAttribute('viewBox',`0 0 ${(COLS-1)*CELL_SIZE} ${(ROWS-1)*CELL_SIZE}`);

  // 横线
  for(let i=0;i<ROWS;i++){
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',0);line.setAttribute('y1',i*CELL_SIZE);
    line.setAttribute('x2',(COLS-1)*CELL_SIZE);line.setAttribute('y2',i*CELL_SIZE);
    line.setAttribute('stroke','#f2a8be');line.setAttribute('stroke-width',1.5);
    line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
  }
  // 竖线
  for(let i=0;i<COLS;i++){
    if(i===0||i===COLS-1){
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',i*CELL_SIZE);line.setAttribute('y1',0);
      line.setAttribute('x2',i*CELL_SIZE);line.setAttribute('y2',(ROWS-1)*CELL_SIZE);
      line.setAttribute('stroke','#f2a8be');line.setAttribute('stroke-width',1.5);
      line.setAttribute('stroke-linecap','round');
      svg.appendChild(line);
    }else{
      for(const[y1,y2]of[[0,4*CELL_SIZE],[5*CELL_SIZE,(ROWS-1)*CELL_SIZE]]){
        const line=document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',i*CELL_SIZE);line.setAttribute('y1',y1);
        line.setAttribute('x2',i*CELL_SIZE);line.setAttribute('y2',y2);
        line.setAttribute('stroke','#f2a8be');line.setAttribute('stroke-width',1.5);
        line.setAttribute('stroke-linecap','round');
        svg.appendChild(line);
      }
    }
  }
  // 九宫斜线（按显示行映射，后手视角自动翻转到自己一侧）
  const palace=[[3,0,5,2],[5,0,3,2],[3,7,5,9],[5,7,3,9]];
  for(const[c1,r1,c2,r2]of palace){
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',c1*CELL_SIZE);line.setAttribute('y1',mr(r1)*CELL_SIZE);
    line.setAttribute('x2',c2*CELL_SIZE);line.setAttribute('y2',mr(r2)*CELL_SIZE);
    line.setAttribute('stroke','#f2a8be');line.setAttribute('stroke-width',1.5);
    line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
  }
  // 楚河汉界（Q版粉紫）
  const text1=document.createElementNS('http://www.w3.org/2000/svg','text');
  text1.setAttribute('x',1.5*CELL_SIZE);text1.setAttribute('y',4.65*CELL_SIZE);
  text1.setAttribute('fill','#d8a0b8');text1.setAttribute('font-size','22');
  text1.setAttribute('font-family',"'YouYuan','幼圆',serif");
  text1.setAttribute('opacity',0.7);text1.textContent='楚 河';
  svg.appendChild(text1);
  const text2=document.createElementNS('http://www.w3.org/2000/svg','text');
  text2.setAttribute('x',5.8*CELL_SIZE);text2.setAttribute('y',4.65*CELL_SIZE);
  text2.setAttribute('fill','#d8a0b8');text2.setAttribute('font-size','22');
  text2.setAttribute('font-family',"'YouYuan','幼圆',serif");
  text2.setAttribute('opacity',0.7);text2.textContent='漢 界';
  svg.appendChild(text2);

  boardEl.appendChild(svg);

  // 上一步高亮
  if(lastMove){
    for(const pos of[lastMove.from,lastMove.to]){
      const div=document.createElement('div');
      div.className='last-move';
      const x=BOARD_PADDING+pos.col*CELL_SIZE;
      const y=BOARD_PADDING+mr(pos.row)*CELL_SIZE;
      div.style.cssText=`left:${x-PIECE_SIZE/2-5}px;top:${y-PIECE_SIZE/2-5}px;width:${PIECE_SIZE+10}px;height:${PIECE_SIZE+10}px;transform:translate(0,0);`;
      boardEl.appendChild(div);
    }
  }

  // 走法提示
  for(const m of validMoves){
    const x=BOARD_PADDING+m.col*CELL_SIZE;
    const y=BOARD_PADDING+mr(m.row)*CELL_SIZE;
    const isCapture=board[m.row][m.col]!==null;
    const div=document.createElement('div');
    div.className=isCapture?'capture-hint':'move-hint';
    if(isCapture){
      div.style.cssText=`left:${x}px;top:${y}px;width:${PIECE_SIZE+8}px;height:${PIECE_SIZE+8}px;transform:translate(-50%,-50%);`;
    }else{
      div.style.cssText=`left:${x}px;top:${y}px;width:18px;height:18px;transform:translate(-50%,-50%);`;
    }
    boardEl.appendChild(div);
  }

  // 棋子
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const piece=board[r][c];
      if(!piece)continue;
      const x=BOARD_PADDING+c*CELL_SIZE;
      const y=BOARD_PADDING+mr(r)*CELL_SIZE;
      const div=document.createElement('div');
      const isSelected=selectedPiece&&selectedPiece.row===r&&selectedPiece.col===c;
      const inCheck=isCheck&&piece.type==='king'&&piece.color===currentTurn&&status==='playing';
      div.className=`piece piece-${piece.color}${isSelected?' selected':''}${inCheck?' in-check':''}`;
      div.style.cssText=`left:${x-PIECE_SIZE/2}px;top:${y-PIECE_SIZE/2}px;width:${PIECE_SIZE}px;height:${PIECE_SIZE}px;`;
      div.dataset.row=r;div.dataset.col=c;

      const inner=document.createElement('div');
      inner.className='piece-inner';
      inner.style.fontSize=(PIECE_SIZE*0.55)+'px';
      inner.textContent=PIECE_CHINESE[piece.color][piece.type];
      div.appendChild(inner);

      div.addEventListener('click',()=>handleCellClick(r,c));
      boardEl.appendChild(div);
    }
  }

  // 空格点击区域
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(board[r][c])continue;
      const x=BOARD_PADDING+c*CELL_SIZE;
      const y=BOARD_PADDING+mr(r)*CELL_SIZE;
      const div=document.createElement('div');
      div.style.cssText=`position:absolute;left:${x-CELL_SIZE/2}px;top:${y-CELL_SIZE/2}px;width:${CELL_SIZE}px;height:${CELL_SIZE}px;z-index:1;cursor:pointer;`;
      div.dataset.row=r;div.dataset.col=c;
      div.addEventListener('click',()=>handleCellClick(r,c));
      boardEl.appendChild(div);
    }
  }

  // ===== Q版特效：落子星光粒子 / 吃子残影淡出+碎星光（仅走子触发） =====
  if(isNewMove&&status==='playing'&&lastMove){
    const tx=BOARD_PADDING+lastMove.to.col*CELL_SIZE;
    const ty=BOARD_PADDING+mr(lastMove.to.row)*CELL_SIZE;
    // 落子：细碎星光
    spawnStars(boardEl,tx,ty,7,'#ffd1e0');
    // 吃子：目标位上一局面有子 → 残影缩小淡出 + 破碎星光
    if(prev&&prev[lastMove.to.row]&&prev[lastMove.to.row][lastMove.to.col]){
      spawnEatGhost(boardEl,tx,ty,prev[lastMove.to.row][lastMove.to.col].color);
      spawnStars(boardEl,tx,ty,6,'#ffb3cd');
    }
  }
  // 保存快照（供下次对比吃子）
  renderBoard._prev=cloneBoard(board);
  renderBoard._mvLen=mvLen;
}

// ===== 轻量特效（Web Animations API，自动清理，不卡顿） =====
function spawnStars(parent,x,y,n,color){
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='star-particle';
    const ang=Math.random()*Math.PI*2;
    const dist=12+Math.random()*24;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-10;
    const size=4+Math.random()*5;
    s.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};transform:translate(-50%,-50%);`;
    parent.appendChild(s);
    try{
      s.animate([
        {transform:'translate(-50%,-50%) scale(1)',opacity:1},
        {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(0)`,opacity:0}
      ],{duration:480+Math.random()*320,easing:'cubic-bezier(0.2,0.6,0.4,1)'}).onfinish=()=>s.remove();
    }catch(e){s.remove();}
  }
}
function spawnEatGhost(parent,x,y,color){
  const g=document.createElement('div');
  g.className='eat-ghost';
  const size=PIECE_SIZE;
  const bg=color==='red'
    ?'radial-gradient(circle at 35% 32%,#fff6f0 0%,#ffd9e2 45%,#ffb9cd 100%)'
    :'radial-gradient(circle at 35% 32%,#f6f1ff 0%,#e3d6ff 45%,#c9b6f5 100%)';
  g.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${bg};border:2.5px solid ${color==='red'?'#ff8fa3':'#a092e8'};transform:translate(-50%,-50%);`;
  parent.appendChild(g);
  try{
    g.animate([
      {transform:'translate(-50%,-50%) scale(1)',opacity:0.9},
      {transform:'translate(-50%,-50%) scale(0.2)',opacity:0}
    ],{duration:420,easing:'ease-in'}).onfinish=()=>g.remove();
  }catch(e){g.remove();}
}

// ===== 交互逻辑 =====
function handleCellClick(row,col){
  if(replayMode)return; // 复盘浏览模式只读，不允许走子
  if(selfPlayMode)return; // 自我对弈模式观战只读
  if(status!=='playing')return;
  if(!recordMode&&currentTurn!==playerColor)return; // 记谱模式可代走双方
  if(isAiThinking)return;

  const piece=board[row][col];
  if(selectedPiece){
    const isValidTarget=validMoves.some(m=>m.row===row&&m.col===col);
    if(isValidTarget){
      makeMove({row,col});
      return;
    }
    if(piece&&piece.color===currentTurn){
      selectPiece(row,col);
      return;
    }
    selectPiece(-1,-1);
  }else{
    if(piece&&piece.color===currentTurn){
      selectPiece(row,col);
    }
  }
}

function selectPiece(row,col){
  if(row<0){
    selectedPiece=null;validMoves=[];
    renderBoard();return;
  }
  const piece=board[row][col];
  if(!piece||piece.color!==currentTurn){
    selectedPiece=null;validMoves=[];renderBoard();return;
  }
  playSound('select');
  selectedPiece=piece;
  validMoves=getValidMoves(board,piece,true);
  renderBoard();
}

function makeMove(to){
  if(!selectedPiece)return;
  const from={row:selectedPiece.row,col:selectedPiece.col};
  const isValidMove=validMoves.some(m=>m.row===to.row&&m.col===to.col);
  if(!isValidMove)return;

  const captured=board[to.row][to.col];
  const{board:newBoard}=doMove(board,from,to);
  board=newBoard;

  const notation=generateNotation(selectedPiece,to,captured);
  moveHistory.push({from,to,piece:selectedPiece,captured,notation});

  const nextTurn=currentTurn==='red'?'black':'red';
  currentTurn=nextTurn;
  selectedPiece=null;validMoves=[];

  const inCheck=isKingInCheck(board,nextTurn);
  const checkmate=isCheckmate(board,nextTurn);
  const hasMove=hasAnyLegalMove(board,nextTurn);
  isCheck=inCheck;

  if(captured)playSound('capture');else playSound('move');
  if(inCheck&&status==='playing')setTimeout(()=>playSound('check'),300);

  // 关键修复：nextTurn被将死 → 胜者是走子方（currentTurn），原逻辑红黑颠倒
  let newStatus='playing';
  if(checkmate){newStatus=winnerWhenCheckmated(nextTurn);}
  else if(!hasMove){newStatus='draw';}
  status=newStatus;
  lastMove={from,to};

  resetMoveTimer();
  renderBoard();
  updateUI();
  // 记谱模式：不触发引擎分析、不触发 AI（纯手动录入外来棋谱）
  if(recordMode)return;
  // 玩家落子完成：先立即刷新一次面板（现有估值），随后启动引擎搜索评估再刷新
  updateWinRate();
  requestAnalysis();

  if(newStatus!=='playing'){
    setTimeout(()=>showGameOver(newStatus),500);
    return;
  }

  if(currentTurn===getAiColor()){
    setTimeout(()=>aiMove(),400);
  }
}

// 请求一次引擎分析（防并发：快速连续走棋时自动取消上一轮未完成的分析）
let analysisSeq=0;
function requestAnalysis(){
  if(status!=='playing')return;
  Engine.setPosition(board);
  const seq=++analysisSeq;
  const mvCount=moveHistory.length;
  // 使用与难度匹配的搜索深度（对应深度搜索，非静态子力）
  Engine.startAnalysis(function(analysis){
    // 过期结果丢弃：已有更新的分析请求，或局面已再次推进（AI已应招）
    if(seq!==analysisSeq)return;
    if(moveHistory.length!==mvCount)return;
    if(!analysis)return;
    // 用搜索评估刷新面板
    updateWinRate({score:analysis.score,depth:analysis.depth,mate:analysis.mate});
  });
}

// ===== 自我对弈（AI 自动执红黑双方，实时记谱+胜率走势，支持暂停/单步/调速） =====
function selfPlaySpeedName(){return selfPlaySpeed<=300?'快':(selfPlaySpeed>=2000?'慢':'中');}
function updateSelfPlayUI(){
  const btn=document.getElementById('btnSelfPlay');
  const info=document.getElementById('selfPlayInfo');
  if(!selfPlayMode){
    if(btn)btn.textContent='▶ 开始';
    if(info)info.textContent='未开始 · '+selfPlaySpeedName()+'速';
  }else if(selfPlayPaused){
    if(btn)btn.textContent='▶ 继续';
    if(info)info.textContent='已暂停 · '+selfPlaySpeedName()+'速（可点单步）';
  }else{
    if(btn)btn.textContent='⏸ 暂停';
    if(info)info.textContent='自动对弈中 · '+selfPlaySpeedName()+'速';
  }
}
function scheduleSelfPlay(){
  if(!selfPlayMode||selfPlayPaused||status!=='playing')return;
  clearTimeout(selfPlayTimer);
  selfPlayTimer=setTimeout(()=>aiMove(),selfPlaySpeed);
}
function startSelfPlay(){
  // 重新开局后再进入自我对弈（从初始局面开始）
  restart();
  selfPlayMode=true;
  selfPlayPaused=false;
  updateSelfPlayUI();
  updateUI();
  scheduleSelfPlay();
}
function toggleSelfPlay(){
  if(!selfPlayMode){
    startSelfPlay();
    return;
  }
  // 进行中 → 暂停；已暂停 → 恢复
  selfPlayPaused=!selfPlayPaused;
  if(!selfPlayPaused)scheduleSelfPlay();
  updateSelfPlayUI();
  updateUI();
}
function stepSelfPlay(){
  // 仅暂停且引擎空闲时可单步走一手（放行一次，走完后自动回到暂停）
  if(selfPlayMode&&selfPlayPaused&&!isAiThinking){
    selfStepOnce=true;
    aiMove();
  }
}
function stopSelfPlay(){
  selfPlayMode=false;
  selfPlayPaused=false;
  selfStepOnce=false;
  clearTimeout(selfPlayTimer);
  selfPlayTimer=null;
  updateSelfPlayUI();
}

// ===== 认输（玩家主动认输，对手获胜） =====
function resignGame(){
  if(replayMode||selfPlayMode||recordMode)return;
  if(status!=='playing')return;
  if(isAiThinking){Engine.stopAnalysis();isAiThinking=false;}
  status=playerColor==='red'?'black_won':'red_won';
  const t=document.getElementById('aiThinking');
  if(t)t.style.display='none';
  updateUI();
  updateWinRate();
  setTimeout(()=>showGameOver(status),300);
}

// ===== 记谱模式（手动录入外来棋谱：双方均由玩家点击走子，AI 不参与） =====
function toggleRecord(){
  if(recordMode){
    recordMode=false;
    updateUI();
    return;
  }
  if(replayMode)return;
  restart(); // 从初始局面开始录入（restart 会清掉 recordMode）
  recordMode=true;
  updateUI();
}

function aiMove(){
  if(recordMode)return; // 记谱模式：AI 绝不参与
  // 自我对弈时：红黑双方均由 AI 执子，谁轮到谁走
  const aiCol=selfPlayMode?currentTurn:getAiColor();
  if(status!=='playing'||currentTurn!==aiCol)return;
  // 自我对弈暂停时：不自动走子；单步（stepSelfPlay）放行一次
  if(selfPlayMode&&selfPlayPaused){
    if(!selfStepOnce)return;
    selfStepOnce=false;
  }
  // 内置JS引擎已禁用：Pikafish 不可用时明确报错，AI 不走子、绝不降级
  if(!Engine._pfReady()){
    // 引擎仍在加载中：稍后自动重试，避免开局卡死（加载完成后自动续走）
    if(window.EngineAdapter&&EngineAdapter.state==='loading'){
      setTimeout(()=>aiMove(),500);
      return;
    }
    const t=document.getElementById('aiThinking');
    if(t){t.style.display='block';t.textContent='⚠ Pikafish引擎不可用，AI无法行棋';}
    isAiThinking=false;
    updateUI();
    return;
  }
  // 关键修复：先在主线程检测AI是否真有合法走法，避免Worker异常或返回null时误判"认输"
  if(!hasAnyLegalMove(board,aiCol)){
    // 仅在真无合法走法时判定结局（被将死=对方胜，困毙=和棋）
    if(isKingInCheck(board,aiCol)){status=winnerWhenCheckmated(aiCol);}
    else{status='draw';}
    isAiThinking=false;
    document.getElementById('aiThinking').style.display='none';
    updateUI();
    updateWinRate();
    if(status!=='playing')setTimeout(()=>showGameOver(status),300);
    return;
  }
  isAiThinking=true;
  document.getElementById('aiThinking').style.display='block';
  document.getElementById('aiThinking').textContent=(aiCol==='red'?'红方':'黑方')+'思索中...';
  updateUI();
  // 通过统一引擎接口请求最佳走法（Worker异步计算，不阻塞主线程）
  Engine.setPosition(board);
  Engine.getBestMove(function(result){
    if(status!=='playing'){
      isAiThinking=false;
      document.getElementById('aiThinking').style.display='none';
      return;
    }
    // 关键修复：result 为 null 时绝不直接判对方胜，而是再次检测AI合法走法
    if(!result){
      // 二次确认：AI是否真无合法走法
      if(!hasAnyLegalMove(board,aiCol)){
        if(isKingInCheck(board,aiCol)){status=winnerWhenCheckmated(aiCol);}
        else{status='draw';}
      }else{
        // Worker异常但有合法走法 → 随机走一步合法走法，绝不认输
        const fallback=firstLegalMove(board,aiCol);
        if(fallback){
          applyAiMove(fallback);
          return;
        }
        // 极端兜底：维持现状
        isAiThinking=false;
        document.getElementById('aiThinking').style.display='none';
        return;
      }
      isAiThinking=false;
      document.getElementById('aiThinking').style.display='none';
      updateUI();
      updateWinRate();
      if(status!=='playing')setTimeout(()=>showGameOver(status),300);
      return;
    }
    applyAiMove(result);
  },aiCol);
}
// 取黑方首个合法走法（兜底使用）
function firstLegalMove(b,color){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=b[r][c];
    if(p&&p.color===color){
      const m=getValidMoves(b,p,true);
      if(m.length>0)return{from:{row:r,col:c},to:m[0]};
    }
  }
  return null;
}
// 应用AI走法（与aiMove解耦，便于兜底路径复用）
function applyAiMove(result){
  const aiCol=selfPlayMode?currentTurn:getAiColor();
  const piece=board[result.from.row][result.from.col];
  if(!piece){
    // 兜底：from 位置无棋子（不应发生），改为首个合法走法
    const fb=firstLegalMove(board,aiCol);
    if(!fb){
      isAiThinking=false;
      document.getElementById('aiThinking').style.display='none';
      return;
    }
    return applyAiMove(fb);
  }
  const captured=board[result.to.row][result.to.col];
  const{board:newBoard}=doMove(board,result.from,result.to);
  board=newBoard;

  const notation=generateNotation(piece,result.to,captured);
  moveHistory.push({from:result.from,to:result.to,piece,captured,notation,score:result.score,depth:result.depth,mate:result.mate});

  // 回合切换：自我对弈时交给另一色AI，人机对弈时交回玩家
  const nextTurn=aiCol==='red'?'black':'red';
  currentTurn=nextTurn;
  // 同步引擎内部局面（pikafish 后端必需，避免引擎局面滞后一步；internal 后端无副作用）
  Engine.setPosition(board);
  const inCheck=isKingInCheck(board,nextTurn);
  const checkmate=isCheckmate(board,nextTurn);
  const hasMove=hasAnyLegalMove(board,nextTurn);
  isCheck=inCheck;

  let newStatus='playing';
  if(checkmate){newStatus=winnerWhenCheckmated(nextTurn);}
  else if(!hasMove){newStatus='draw';}
  status=newStatus;
  lastMove={from:result.from,to:result.to};

  if(captured)playSound('capture');else playSound('move');
  if(inCheck&&status==='playing')setTimeout(()=>playSound('check'),300);

  isAiThinking=false;
  document.getElementById('aiThinking').style.display='none';
  resetMoveTimer();
  renderBoard();
  updateUI();
  // AI落子完成：仅当引擎给出真实搜索估值时才强制覆盖面板
  // result.score 为AI视角，换算为红方视角统一显示；开局库等无估值走法（score为null）不覆盖
  if(typeof result.score==='number'){
    const redScore=aiCol==='red'?result.score:-result.score;
    updateWinRate({score:redScore,depth:result.depth,mate:result.mate});
  }else{
    updateWinRate();
  }

  if(newStatus!=='playing'){
    // 终局：结束自我对弈，停在结算界面（可保存棋谱/再来一局）
    if(selfPlayMode){selfPlayFinished=true;stopSelfPlay();}
    setTimeout(()=>showGameOver(newStatus),500);
    return;
  }
  // 自我对弈：继续让另一色 AI 走子
  if(selfPlayMode)scheduleSelfPlay();
}

function generateNotation(piece,to,captured){
  const ch=PIECE_CHINESE[piece.color][piece.type];
  const col=piece.color==='red'?9-piece.col:piece.col+1;
  const targetCol=piece.color==='red'?9-to.col:to.col+1;
  const action=captured?'吃':'平';
  return`${ch}${col}${action}${targetCol}`;
}

// ============ 实时胜率面板 ============
// 胜率换算基于引擎【搜索评估】分值（区分静态物质评估：staticScore仅作参考/兜底）
// 触发时机：仅落子完成后单次计算（玩家走子→requestAnalysis搜索；AI走子→复用其搜索估值），禁止循环计算
let lastEvalScore=0;
let lastEvalDepth=0;
let lastEvalMate=0;

// 【已禁用】主线程轻量静态评估——内置JS引擎已禁用后，胜率只允许来自 Pikafish 搜索评估，
// 本函数保留仅供代码阅读参考，不再被任何调用路径使用。
function staticEval(b){
  let s=0;
  let redK=false,blackK=false;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const p=b[r][c];if(!p)continue;
    const v=PIECE_VALUE[p.type];
    if(p.type==='king'){if(p.color==='red')redK=true;else blackK=true;}
    // 红方视角：红+黑-
    s+=p.color==='red'?v:-v;
    // 卒兵过河加分
    if(p.type==='soldier'){
      const crossed=p.color==='red'?p.row<=4:p.row>=5;
      if(crossed)s+=p.color==='red'?30:-30;
    }
  }
  if(!redK)return -50000;
  if(!blackK)return 50000;
  return s;
}

// forced 可选：{score,depth,mate} 强制使用指定搜索估值（红方视角）
// 无 forced 时依次取：引擎最近分析结果 → 最近AI走子估值（均来自 Pikafish）；
// 均无 → 显示"引擎未就绪"，绝不使用内置静态评估伪造数据
function updateWinRate(forced){
  const winrateRed=document.getElementById('winrateRed');
  const winrateBlack=document.getElementById('winrateBlack');
  const winrateRedBar=document.getElementById('winrateRedBar');
  const winrateBlackBar=document.getElementById('winrateBlackBar');
  const winrateStatus=document.getElementById('winrateStatus');
  const winrateSpecial=document.getElementById('winrateSpecial');
  const winrateEval=document.getElementById('winrateEval');
  const winrateDepth=document.getElementById('winrateDepth');
  if(!winrateRed)return;

  // 取得搜索评估分值（红方视角，越大越有利红方）
  let score=null;
  let depth=0;
  let mate=0;
  let isSearchEval=false;
  if(forced&&typeof forced.score==='number'){
    score=forced.score;
    depth=forced.depth||0;
    mate=forced.mate||0;
    isSearchEval=true;
  }else{
    // 引擎最近一次分析结果（搜索评估）
    const analysis=Engine.getScore();
    if(analysis&&typeof analysis.score==='number'){
      score=analysis.score;
      depth=analysis.depth||0;
      mate=analysis.mate||0;
      isSearchEval=true;
    }else{
      // 最近AI走子估值（AI视角→红方视角，随AI颜色动态换算）
      const lastAiMove=moveHistory[moveHistory.length-1];
      if(lastAiMove&&typeof lastAiMove.score==='number'){
        score=getAiColor()==='red'?lastAiMove.score:-lastAiMove.score;
        depth=lastAiMove.depth||0;
        mate=lastAiMove.mate||0;
        isSearchEval=true;
      }
      // 【内置JS引擎已禁用】不再 staticEval 静态兜底；无 Pikafish 搜索评估时
      // 由下方"引擎未就绪"分支统一处理，绝不伪造胜率数据
    }
  }
  lastEvalScore=score;
  lastEvalDepth=depth;
  lastEvalMate=mate;

  // 终局状态特殊处理（补记终局胜率点并绘制走势图）
  if(status==='red_won'){
    setWinrateUI(100,0,'红方胜利',null,score,depth);
    pushWinPoint(moveHistory.length,100,score);
    drawWinrateChart(winRateHistory,moveHistory.length);
    return;
  }
  if(status==='black_won'){
    setWinrateUI(0,100,'黑方胜利',null,score,depth);
    pushWinPoint(moveHistory.length,0,score);
    drawWinrateChart(winRateHistory,moveHistory.length);
    return;
  }
  if(status==='draw'){
    setWinrateUI(50,50,'和棋',null,score,depth);
    pushWinPoint(moveHistory.length,50,score);
    drawWinrateChart(winRateHistory,moveHistory.length);
    return;
  }

  // 将杀标记
  if(mate!==0){
    const mateStr=mate>0?`红方${mate}步绝杀`:`黑方${-mate}步绝杀`;
    const mateClass='mate';
    if(mate>0){
      setWinrateUI(100,0,`${mate}步绝杀`,{text:mateStr,cls:mateClass},score,depth);
      pushWinPoint(moveHistory.length,100,score);
    }else{
      setWinrateUI(0,100,`${-mate}步绝杀`,{text:mateStr,cls:mateClass},score,depth);
      pushWinPoint(moveHistory.length,0,score);
    }
    drawWinrateChart(winRateHistory,moveHistory.length);
    return;
  }

  // 无任何搜索评估：Pikafish未就绪则明确提示；就绪但暂无评估则显示中性"等待分析"，绝不伪造数据
  if(score===null||typeof score!=='number'){
    if(Engine._pfReady()){
      // 引擎已就绪但暂无搜索评估（如刚开局未分析）：显示中性状态，避免残留"引擎未就绪"
      setWinrateUI(50,50,'等待分析',null,null,0);
    }else{
      setWinrateUI(50,50,'引擎未就绪',null,null,0);
    }
    drawWinrateChart(winRateHistory,moveHistory.length);
    return;
  }

  // 将军标记（不与绝杀冲突）
  let special=null;
  if(isCheck&&status==='playing'){
    const who=currentTurn==='red'?'红方被将':'黑方被将';
    special={text:who,cls:'check'};
  }

  // 估值换算胜率：分段映射（比单一sigmoid更灵敏，强弱局势区分清晰）
  // score 是红方视角（兵分基准），越接近杀棋分越饱和，中段随估值快速变化
  let redPct;
  if(score>=MATE_THRESHOLD)redPct=99;
  else if(score<=-MATE_THRESHOLD)redPct=1;
  else{
    // 非线性放大中间段灵敏度：k=450，±450分≈73%/27%
    const k=450;
    redPct=Math.round((1/(1+Math.exp(-score/k)))*98+1);
    redPct=Math.max(1,Math.min(99,redPct));
  }
  const blackPct=100-redPct;

  // 局势文字标注
  let statusText='均势';
  let statusClass='';
  const abs=Math.abs(score);
  if(abs<60){statusText='均势';}
  else if(abs<180){statusText=score>0?'红方小优':'黑方小优';statusClass=score>0?'adv-red':'adv-black';}
  else if(abs<500){statusText=score>0?'红方优势':'黑方优势';statusClass=score>0?'adv-red':'adv-black';}
  else if(abs<1200){statusText=score>0?'红方大优':'黑方大优';statusClass=score>0?'adv-red':'adv-black';}
  else{statusText=score>0?'红方胜势':'黑方胜势';statusClass=score>0?'adv-red':'adv-black';}

  setWinrateUI(redPct,blackPct,statusText,special,score,depth,isSearchEval);

  // 录制胜率历史（与 moveHistory 同步：新增则 push，悔棋则截断）
  pushWinPoint(moveHistory.length,redPct,score);
  // 实时绘制胜率走势图
  drawWinrateChart(winRateHistory,moveHistory.length);
}
// 胜率历史补记/追加：同一 idx 不重复记录（悔棋回退时按 idx 截断）
function pushWinPoint(idx,redPct,score){
  winRateHistory=winRateHistory.filter(p=>p.idx<idx);
  winRateHistory.push({idx:idx,redPct:redPct,score:typeof score==='number'?Math.round(score):0});
}
function setWinrateUI(redPct,blackPct,statusText,special,score,depth,isSearchEval){
  const winrateRed=document.getElementById('winrateRed');
  const winrateBlack=document.getElementById('winrateBlack');
  const winrateRedBar=document.getElementById('winrateRedBar');
  const winrateBlackBar=document.getElementById('winrateBlackBar');
  const winrateStatus=document.getElementById('winrateStatus');
  const winrateSpecial=document.getElementById('winrateSpecial');
  const winrateEval=document.getElementById('winrateEval');
  const winrateDepth=document.getElementById('winrateDepth');
  const winrateEvalLabel=document.getElementById('winrateEvalLabel');
  if(!winrateRed)return;
  winrateRed.textContent=redPct+'%';
  winrateBlack.textContent=blackPct+'%';
  winrateRedBar.style.width=redPct+'%';
  winrateBlackBar.style.width=blackPct+'%';
  winrateStatus.textContent=statusText;
  winrateStatus.className='winrate-status';
  if(statusText.indexOf('红')>=0)winrateStatus.classList.add('adv-red');
  else if(statusText.indexOf('黑')>=0)winrateStatus.classList.add('adv-black');
  if(special){
    winrateSpecial.style.display='block';
    winrateSpecial.textContent=special.text;
    winrateSpecial.className='winrate-special '+special.cls;
  }else{
    winrateSpecial.style.display='none';
  }
  // 评估原始分值 + 评估类型标记（搜索评估/无评估）；内置静态评估已禁用
  if(winrateEvalLabel)winrateEvalLabel.textContent=isSearchEval?'搜索估值：':'评估：';
  winrateEval.textContent=(score===null||score===undefined)?'--':((score>=0?'+':'')+Math.round(score));
  winrateEval.dataset.type=isSearchEval?'search':'none';
  winrateDepth.textContent=(isSearchEval&&depth>0?`· 深度${depth}`:'');
}

function undoMove(){
  // 记谱模式：逐手悔棋（一次撤销1步，便于修正外来棋谱录入错误）
  if(recordMode){
    if(moveHistory.length<1||isAiThinking)return;
    moveHistory=moveHistory.slice(0,-1);
    let nb=createInitialBoard();
    for(const m of moveHistory){
      const r=doMove(nb,m.from,m.to);
      nb=r.board;
    }
    board=nb;
    currentTurn=moveHistory.length%2===0?'red':'black';
    selectedPiece=null;validMoves=[];
    isCheck=isKingInCheck(board,currentTurn);
    status='playing';
    lastMove=moveHistory.length>0?{from:moveHistory[moveHistory.length-1].from,to:moveHistory[moveHistory.length-1].to}:null;
    renderBoard();
    updateUI();
    return;
  }
  if(moveHistory.length<2||isAiThinking)return;
  // 停止可能进行中的分析（防并发：旧分析结果作废）
  Engine.stopAnalysis();
  analysisSeq++;
  moveHistory=moveHistory.slice(0,-2);
  let newBoard=createInitialBoard();
  for(const m of moveHistory){
    const r=doMove(newBoard,m.from,m.to);
    newBoard=r.board;
  }
  board=newBoard;
  // 悔棋后轮玩家行棋
  currentTurn=playerColor;
  selectedPiece=null;validMoves=[];
  isCheck=isKingInCheck(board,playerColor);
  status='playing';
  lastMove=moveHistory.length>0?{from:moveHistory[moveHistory.length-1].from,to:moveHistory[moveHistory.length-1].to}:null;
  resetMoveTimer();
  renderBoard();
  updateUI();
  // 悔棋后重新评估当前局面（避免复用旧分析值）
  updateWinRate();
  requestAnalysis();
}

function restart(){
  // 重开/再来一局时退出自我对弈与记谱模式（startSelfPlay/startRecord 会再次进入）
  if(selfPlayMode)stopSelfPlay();
  recordMode=false;
  selfPlayFinished=false;
  Engine.stopAnalysis();
  analysisSeq++;
  board=createInitialBoard();
  // 象棋规则红方先行：玩家执红则由玩家先走；玩家执黑则由AI(红)先走
  currentTurn='red';selectedPiece=null;validMoves=[];
  moveHistory=[];status='playing';isCheck=false;
  winRateHistory=[];
  replayMoves=[];replayIndex=0;replayMode=false;replayWin=[];
  exitReplayUI();
  // 清空走势图（无数据占位）
  drawWinrateChart([],0);
  lastMove=null;isAiThinking=false;
  redTime=600;blackTime=600;moveTime=0;
  document.getElementById('aiThinking').style.display='none';
  document.getElementById('overlay').style.display='none';
  resetMoveTimer();
  renderBoard();
  updateUI();
  updateWinRate();
  // 玩家执黑后行：AI执红先行
  if(playerColor==='black'){
    setTimeout(()=>aiMove(),400);
  }
}

// ===================== 棋谱保存 / 打开 / 复盘 =====================
// —— 保存棋谱（File System Access API 优先，fallback 下载） ——
// 复盘浏览模式下保存整盘 replayMoves（"复盘之后也可以保存"）；对弈/自我对弈保存 moveHistory
function saveGameFile(){
  const moves=replayMode?replayMoves:moveHistory;
  if(moves.length===0){alert('尚无对局可保存');return;}
  const data={
    app:'xiangqi',
    version:1,
    meta:{
      date:new Date().toISOString(),
      playerColor:playerColor,
      difficulty:difficulty,
      result:status
    },
    moves:moves.map(m=>({
      from:m.from,to:m.to,
      captured:m.captured?m.captured.type:null,
      notation:m.notation
    })),
    winRate:replayMode?replayWin:winRateHistory
  };
  const json=JSON.stringify(data,null,2);
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const fname=`象棋棋谱_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({
      suggestedName:fname,
      types:[{description:'象棋棋谱',accept:{'application/json':['.json']}}]
    }).then(async fh=>{
      const w=await fh.createWritable();
      await w.write(json);
      await w.close();
    }).catch(err=>{if(err&&err.name!=='AbortError')downloadJson(json,fname);});
  }else{
    downloadJson(json,fname);
  }
}
function downloadJson(json,fname){
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);
}

function openGameFile(){
  if(window.showOpenFilePicker){
    window.showOpenFilePicker({types:[{description:'象棋棋谱',accept:{'application/json':['.json']}}]})
      .then(async handles=>{
        const file=await handles[0].getFile();
        const text=await file.text();
        loadReplayData(JSON.parse(text));
      }).catch(err=>{if(err&&err.name!=='AbortError')console.error(err);});
  }else{
    const inp=document.createElement('input');
    inp.type='file';inp.accept='.json,application/json';
    inp.onchange=()=>{
      const file=inp.files&&inp.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{try{loadReplayData(JSON.parse(reader.result));}catch(e){alert('棋谱文件解析失败');}};
      reader.readAsText(file);
    };
    inp.click();
  }
}
function loadReplayData(data){
  if(!data||data.app!=='xiangqi'||!Array.isArray(data.moves)){
    alert('不是有效的象棋棋谱文件');return;
  }
  // 停止对局相关活动
  Engine.stopAnalysis();
  analysisSeq++;
  clearInterval(timerInterval);clearInterval(moveTimerInterval);
  document.getElementById('aiThinking').style.display='none';
  // 进入复盘
  replayMoves=data.moves;
  replayWin=Array.isArray(data.winRate)?data.winRate:[];
  replayIndex=0;
  replayMode=true;
  moveHistory=[];
  winRateHistory=replayWin.slice();
  status='replay';
  applyReplayStep(0);
  enterReplayUI();
  renderMoveList();
}
function applyReplayStep(idx){
  if(idx<0||idx>replayMoves.length)return;
  replayIndex=idx;
  // 重放：初始局面 + moves[0..idx-1]
  let nb=createInitialBoard();
  for(let i=0;i<idx;i++){
    const r=doMove(nb,replayMoves[i].from,replayMoves[i].to);
    nb=r.board;
  }
  board=nb;
  currentTurn=(idx%2===0)?'red':'black';
  selectedPiece=null;validMoves=[];
  lastMove=idx>0?{from:replayMoves[idx-1].from,to:replayMoves[idx-1].to}:null;
  isCheck=idx>0?isKingInCheck(board,currentTurn):false;
  renderBoard();
  updateUI();
  // 复盘回放：用棋谱文件中的历史胜率绘制（对弈实时曲线见 updateWinRate）
  drawWinrateChart(replayWin,replayIndex);
  highlightReplayRow();
}
function exitReplay(continuePlay){
  const idx=replayIndex;
  replayMode=false;
  exitReplayUI();
  if(continuePlay){
    // 从当前步继续对弈：保留已回放的走法历史，保证棋谱/悔棋连续
    moveHistory=replayMoves.slice(0,idx);
    status='playing';
    isAiThinking=false;
    lastMove=idx>0?{from:replayMoves[idx-1].from,to:replayMoves[idx-1].to}:null;
    startTimers();
    renderBoard();
    updateUI();
    updateWinRate();
    if(currentTurn===getAiColor()&&status==='playing'){
      setTimeout(()=>aiMove(),400);
    }
  }else{
    restart();
  }
}

// 胜率走势图（对弈实时 + 复盘回放共用）
// pts: [{idx,redPct,score}]，cursorIdx: 当前回放/当前步数（用于游标）
function drawWinrateChart(pts,cursorIdx){
  const chart=document.getElementById('winrateChart');
  if(!chart)return;
  pts=pts||[];
  cursorIdx=(typeof cursorIdx==='number')?cursorIdx:0;
  if(pts.length===0){
    chart.innerHTML='<div class="chart-empty">暂无胜率数据</div>';
    return;
  }
  const W=chart.clientWidth||260,H=132;
  const padL=30,padR=8,padT=14,padB=16;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const yMid=padT+plotH*0.5;
  const maxIdx=Math.max.apply(null,pts.map(p=>p.idx));
  const X=i=>padL+(maxIdx>0?plotW*i/maxIdx:plotW/2);
  const Y=p=>padT+plotH*(1-p.redPct/100);
  let svg=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;">`;
  // Y 轴网格 + 百分比刻度
  for(const g of[0,25,50,75,100]){
    const y=padT+plotH*(1-g/100);
    svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${g===50?'#d9b6cf':'#efe3ee'}" stroke-width="${g===50?1.5:1}" ${g===50?'stroke-dasharray="5,3"':''}/>`;
    svg+=`<text x="${padL-5}" y="${y+3}" fill="#b3a9d6" font-size="9" text-anchor="end">${g}%</text>`;
  }
  // 红优 / 黑优 标注（一眼判断上下区域归属）
  svg+=`<text x="${W-padR-2}" y="${padT+4}" fill="#f76a8e" font-size="10" font-weight="bold" text-anchor="end">▲ 红优</text>`;
  svg+=`<text x="${W-padR-2}" y="${H-padB-2}" fill="#7a6fae" font-size="10" font-weight="bold" text-anchor="end">▼ 黑优</text>`;
  // 数据点（按 idx 排序，避免乱序）
  const ptArr=pts.slice().sort((a,b)=>a.idx-b.idx);
  // 面积填充：折线与50%中线之间的区域，上红下紫渐变色
  if(ptArr.length>=2){
    let d=`M ${X(ptArr[0].idx)} ${Y(ptArr[0])}`;
    for(let i=1;i<ptArr.length;i++)d+=` L ${X(ptArr[i].idx)} ${Y(ptArr[i])}`;
    d+=` L ${X(ptArr[ptArr.length-1].idx)} ${yMid} L ${X(ptArr[0].idx)} ${yMid} Z`;
    svg+=`<path d="${d}" fill="url(#gradMix)" opacity="0.5"/>`;
  }
  // 折线
  if(ptArr.length>=2){
    const line=ptArr.map((p,i)=>(i===0?X(p.idx)+','+Y(p):' '+X(p.idx)+','+Y(p))).join('');
    svg+=`<polyline points="${line}" fill="none" stroke="#f76a8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // 数据点 + 悬停提示（第N手 · 红x% · 估值±x）
  for(const p of ptArr){
    const isCur=p.idx===cursorIdx;
    const s=p.score;
    const scoreTxt=(s===null||s===undefined)?'--':((s>=0?'+':'')+s);
    svg+=`<circle cx="${X(p.idx)}" cy="${Y(p)}" r="${isCur?4.5:2.5}" fill="#f76a8e" stroke="${isCur?'#fff':'none'}" stroke-width="1.5"><title>第${p.idx}手 · 红${p.redPct}% · 估值${scoreTxt}</title></circle>`;
  }
  // 当前回放/当前步游标 + 当前值标签
  const cx=Math.min(cursorIdx,maxIdx);
  if(maxIdx>0){
    svg+=`<line x1="${X(cx)}" y1="${padT}" x2="${X(cx)}" y2="${H-padB}" stroke="#a092e8" stroke-width="1.5" stroke-dasharray="3,2"/>`;
  }
  const curPt=ptArr.filter(p=>p.idx===cursorIdx)[0];
  if(curPt){
    svg+=`<text x="${Math.max(padL,Math.min(W-padR,X(curPt.idx)))}" y="${Y(curPt.idx)-7}" fill="#6b5d6b" font-size="10" text-anchor="middle" font-weight="bold">第${curPt.idx}手 ${curPt.redPct}%</text>`;
  }
  // X 轴首/尾手数
  svg+=`<text x="${padL}" y="${H-4}" fill="#b3a9d6" font-size="9" text-anchor="start">第1手</text>`;
  svg+=`<text x="${W-padR}" y="${H-4}" fill="#b3a9d6" font-size="9" text-anchor="end">第${maxIdx}手</text>`;
  // 渐变定义（50% 中线处透明，上方红、下方紫）
  svg+=`<defs><linearGradient id="gradMix" x1="0" y1="0" x2="0" y2="1">`+
    `<stop offset="0" stop-color="#f76a8e" stop-opacity="1"/>`+
    `<stop offset="0.5" stop-color="#f76a8e" stop-opacity="0"/>`+
    `<stop offset="0.5" stop-color="#7a6fae" stop-opacity="0"/>`+
    `<stop offset="1" stop-color="#7a6fae" stop-opacity="1"/>`+
    `</linearGradient></defs>`;
  svg+='</svg>';
  chart.innerHTML=svg;
}
function highlightReplayRow(){
  const list=document.getElementById('moveList');
  if(!list)return;
  // data-idx 挂在 .move-red/.move-black 上，命中当前回放步所在行
  list.querySelectorAll('.move-entry').forEach(el=>{
    let hit=false;
    el.querySelectorAll('[data-idx]').forEach(sp=>{
      if(replayMode&&parseInt(sp.dataset.idx,10)===replayIndex)hit=true;
    });
    el.classList.toggle('active',hit);
  });
}

function showHint(){
  if(status!=='playing'||currentTurn!==playerColor||isAiThinking)return;
  isAiThinking=true;
  document.getElementById('aiThinking').style.display='block';
  document.getElementById('aiThinking').textContent='思考提示中...';
  updateUI();
  // 通过统一引擎接口请求玩家当前最佳走法作为提示
  Engine.setPosition(board);
  Engine.getBestMove(function(result){
    document.getElementById('aiThinking').style.display='none';
    document.getElementById('aiThinking').textContent=(getAiColor()==='red'?'红方':'黑方')+'思索中...';
    isAiThinking=false;
    if(result){
      const piece=board[result.from.row][result.from.col];
      if(piece){
        selectedPiece=piece;
        validMoves=getValidMoves(board,piece,true);
        renderBoard();
        const targetDiv=document.createElement('div');
        const x=BOARD_PADDING+result.to.col*CELL_SIZE;
        const y=BOARD_PADDING+dispRow(result.to.row)*CELL_SIZE;
        targetDiv.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${PIECE_SIZE+12}px;height:${PIECE_SIZE+12}px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #FFD700;background:radial-gradient(circle,rgba(255,215,0,0.3),transparent);z-index:7;animation:hintPulse 1s ease-in-out infinite;pointer-events:none;`;
        document.getElementById('board').appendChild(targetDiv);
        setTimeout(()=>targetDiv.remove(),3000);
      }
    }
    updateUI();
  },playerColor,Math.min(getTimeLimit(),800));

// ===== UI 更新 =====
function updateUI(){
  // 状态
  const dot=document.getElementById('statusDot');
  const text=document.getElementById('statusText');
  dot.className='status-dot';
  if(replayMode){
    // 复盘浏览：与对弈界面明显区分
    dot.classList.add('replay');
    text.className='status-text replay';
    text.textContent='复盘浏览 · '+replayIndex+'/'+replayMoves.length;
  }else if(recordMode&&status==='playing'){
    // 记谱模式：手动录入外来棋谱
    dot.classList.add(currentTurn);
    text.className='status-text '+currentTurn;
    text.textContent='🎬 记谱 · '+(currentTurn==='red'?'红方':'黑方')+'行棋';
  }else if(status==='playing'){
    dot.classList.add(currentTurn);
    text.className='status-text '+currentTurn;
    // 自我对弈：状态文字带"自动"标识
    text.textContent=(selfPlayMode?'自动 · ':'')+(currentTurn==='red'?'红方行棋':'黑方行棋');
  }else{
    dot.classList.add('idle');
    text.className='status-text gold';
    text.textContent=status==='red_won'?'红方胜！':status==='black_won'?'黑方胜！':'和棋！';
  }

  // 将军提示
  document.getElementById('checkAlert').style.display=(isCheck&&status==='playing'&&!replayMode)?'block':'none';

  // 回合
  document.getElementById('roundNum').textContent=Math.ceil(moveHistory.length/2)||1;

  // 悔棋按钮（复盘/自我对弈禁用以防误操作；记谱模式逐手悔棋，长度>=1即可用）
  document.getElementById('btnUndo').disabled=replayMode||selfPlayMode||(recordMode?moveHistory.length<1:moveHistory.length<2)||isAiThinking;
  document.getElementById('btnHint').disabled=replayMode||selfPlayMode||recordMode||status!=='playing'||currentTurn!==playerColor||isAiThinking;
  document.getElementById('btnRedFirst').disabled=replayMode||selfPlayMode||recordMode;
  document.getElementById('btnBlackFirst').disabled=replayMode||selfPlayMode||recordMode;
  // 认输按钮：仅人机对弈进行中可用
  document.getElementById('btnResign').disabled=replayMode||selfPlayMode||recordMode||status!=='playing';
  // 记谱按钮：复盘/自我对弈时禁用；进行中高亮
  const recBtn=document.getElementById('btnRecordGame');
  recBtn.textContent=recordMode?'🎬 记谱中(点击退出)':'🎬 记谱';
  recBtn.classList.toggle('active',recordMode);
  recBtn.disabled=replayMode||selfPlayMode;

  // 自我对弈状态栏（随对局/速度/暂停实时刷新）
  updateSelfPlayUI();

  // 棋谱
  renderMoveList();

  // 计时器
  updateTimerDisplay();
}

function renderMoveList(){
  const list=document.getElementById('moveList');
  // 复盘模式使用 replayMoves，对弈模式使用 moveHistory
  const moves=replayMode?replayMoves:moveHistory;
  if(moves.length===0){
    list.innerHTML='<div class="move-empty">尚未开局</div>';
    return;
  }
  let html='';
  for(let i=0;i<moves.length;i+=2){
    const red=moves[i];
    const black=moves[i+1];
    html+=`<div class="move-entry"><span class="move-num">${i/2+1}.</span>`;
    html+=`<span class="move-red" data-idx="${i+1}">${red?red.notation:''}</span>`;
    html+=`<span class="move-black" data-idx="${i+2}">${black?black.notation:''}</span>`;
    html+=`</div>`;
  }
  list.innerHTML=html;
  list.scrollTop=list.scrollHeight;
  // 复盘模式：点击棋谱条目跳转到对应步
  if(replayMode){
    list.querySelectorAll('[data-idx]').forEach(el=>{
      el.style.cursor='pointer';
      el.addEventListener('click',()=>applyReplayStep(parseInt(el.dataset.idx,10)));
    });
  }
  highlightReplayRow();
}

// ===== 计时器 =====
function startTimers(){
  startTime=Date.now();
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(status!=='playing')return;
    if(currentTurn==='red'){redTime--;if(redTime<=0){redTime=0;status='black_won';showGameOver(status);}}
    else{blackTime--;if(blackTime<=0){blackTime=0;status='red_won';showGameOver(status);}}
    updateTimerDisplay();
  },1000);

  resetMoveTimer();
}

function resetMoveTimer(){
  moveTime=0;
  if(moveTimerInterval)clearInterval(moveTimerInterval);
  moveTimerInterval=setInterval(()=>{
    if(status!=='playing')return;
    moveTime++;
    updateMoveTimerDisplay();
  },1000);
}

function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=sec%60;
  return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateTimerDisplay(){
  const red=document.getElementById('redTimer');
  const black=document.getElementById('blackTimer');
  red.textContent=formatTime(redTime);
  black.textContent=formatTime(blackTime);
  red.className='timer-value';
  black.className='timer-value';
  if(status==='playing'){
    if(currentTurn==='red'){
      red.classList.add('active');
      if(redTime<60)red.classList.add('warning');
    }else{
      black.classList.add('active');
      if(blackTime<60)black.classList.add('warning');
    }
  }
}

function updateMoveTimerDisplay(){
  document.getElementById('moveTimer').textContent=formatTime(moveTime);
}

// ===== 游戏结束 =====
function showGameOver(result){
  clearInterval(timerInterval);
  clearInterval(moveTimerInterval);
  const overlay=document.getElementById('overlay');
  const text=document.getElementById('resultText');
  const stats=document.getElementById('resultStats');
  // 自我对弈结束：显示中性文案（无"你赢了"语义）
  const wasSelfPlay=selfPlayFinished;
  selfPlayFinished=false;
  // 棋盘语义显示 + 玩家视角胜负提示（支持先后手）
  let resultLine='',youLine='';
  if(result==='red_won'){
    resultLine='红 方 胜';
    text.style.color='#C41E3A';
    youLine=wasSelfPlay?'本局为自我对弈 · 红方获胜':(playerColor==='red'?'🎉 你赢了！':'🤖 电脑赢了！');
    playSound('win');
  }else if(result==='black_won'){
    resultLine='黑 方 胜';
    text.style.color='#F5E6C8';
    youLine=wasSelfPlay?'本局为自我对弈 · 黑方获胜':(playerColor==='black'?'🎉 你赢了！':'🤖 电脑赢了！');
    playSound('win');
  }else{
    resultLine='和 棋';
    text.style.color='#B8860B';
    youLine='双方不分伯仲';
  }
  text.textContent=resultLine+' !';
  const totalTime=600-redTime+600-blackTime;
  stats.innerHTML=`<div style="margin-bottom:8px;color:#B8860B;font-size:16px;font-family:'KaiTi','楷体',serif;">${youLine}</div>总回合数：${Math.ceil(moveHistory.length/2)}<br>对弈总时：${formatTime(totalTime)}<br>红方剩余：${formatTime(redTime)}<br>黑方剩余：${formatTime(blackTime)}`;
  overlay.style.display='flex';
}

// 所有音效均通过 Web Audio API 本地合成，游戏支持完全离线游玩

// ===== 初始化 =====
// 布局尺寸按视口自适应（含工具条高度校准，保证棋盘完整可见、不上下裁切）
board=createInitialBoard();
// 品牌启动画面：引擎就绪或超时 3 秒后淡出
function hideSplash(){var s=document.getElementById('splash');if(s)s.classList.add('hide');}
setTimeout(hideSplash,3000); /* 兜底：最多显示 3 秒 */
// 引擎配置：仅 Pikafish（内置JS引擎已彻底禁用，失败即报错、绝不降级）
if(window.EngineAdapter){
  // 加载状态提示：复用 aiThinking 元素（不改布局）显示 引擎加载中/就绪/失败
  EngineAdapter._onStateChange=function(state,backend){
    const tip=document.getElementById('aiThinking');
    const err=document.getElementById('engineError');
    if(state==='loading'){
      if(err)err.style.display='none';
      if(tip){tip.style.display='block';tip.textContent='⏳ Pikafish引擎加载中...';}
    }else if(state==='failed'){
      // 内置JS引擎已禁用：持久显示错误横幅（含真实错误原因），绝不自动降级
      if(err){
        const msg=document.getElementById('engineErrorMsg');
        if(msg)msg.textContent='⚠ Pikafish引擎加载失败：'+(EngineAdapter.error||'未知原因');
        err.style.display='flex';
      }
      if(tip){tip.style.display='block';tip.textContent='⚠ Pikafish引擎加载失败，AI对弈不可用';}
    }else if(state==='ready'){
      if(err)err.style.display='none';
      hideSplash(); /* 引擎就绪即淡出品牌启动画面 */
      if(tip){tip.style.display='block';tip.textContent='✅ Pikafish引擎就绪';setTimeout(()=>{tip.style.display='none';},2000);}
      // 引擎就绪后刷新胜率面板：清除加载期间残留的"引擎未就绪"提示
      try{updateWinRate();}catch(e){}
    }
  };
  // 强制使用 Pikafish 强引擎（唯一后端）：覆盖历史调试可能残留的 localStorage 开关
  EngineAdapter.setBackend('pikafish');
  // 同步 Engine 后端标识（适配层已按持久化开关应用）
  Engine._backend=EngineAdapter.backend;
}
Engine.setPosition(board);
updateDiffInfo();
resizeBoard();
updateWinRate();
startTimers();
// 引擎重试按钮（Pikafish 加载失败时手动重新加载）
document.getElementById('btnEngineRetry').addEventListener('click',()=>{
  const err=document.getElementById('engineError');
  if(err)err.style.display='none';
  EngineAdapter.setBackend('pikafish');
});
// 便捷开关（控制台/调试用）：内置JS引擎已禁用，仅支持 pikafish
window.setEngine=function(){return Engine.setBackend('pikafish');};
// ===== Service Worker 注册（PWA 离线可用） =====
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('[SW] 注册失败:',e);});});
}
</script>
</body>
</html>
