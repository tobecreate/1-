[package]
name = "xiangqi"
version = "1.0.0"
description = "大布象棋"
authors = ["大布象棋工作室"]
edition = "2021"

[lib]
name = "xiangqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
