[package]
name = "xiangqi"
version = "1.0.0"
description = "大布象棋"
authors = ["哥伦布"]
edition = "2021"

[lib]
name = "xiangqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 必须启用 custom-protocol：否则 dev=true、资产不内嵌、运行时去加载 devUrl → "无法连接"
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
